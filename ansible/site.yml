---
- name: Configure the development guest
  hosts: dev
  gather_facts: true
  vars:
    user_bin_dir: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
  pre_tasks:
    - name: Upgrade the guest OS before configuring development tools
      become: true
      ansible.builtin.import_tasks: tasks/upgrade.yml
      tags: os_upgrade
  tasks:
    - name: Install development packages
      become: true
      ansible.builtin.apt:
        name: "{{ dev_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300
      register: package_install
      until: package_install is succeeded
      retries: 3
      delay: 10

    - name: Configure automatic security updates without automatic reboots
      become: true
      ansible.builtin.import_tasks: tasks/security-updates.yml

    - name: Install the host Ghostty terminal definition
      ansible.builtin.import_tasks: tasks/terminfo.yml

    - name: Create the user executable directory
      ansible.builtin.file:
        path: "{{ user_bin_dir }}"
        state: directory
        mode: '0755'

    - name: Create the guest project directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/src"
        state: directory
        mode: '0755'

    - name: Install native AI coding tools for the guest user
      ansible.builtin.include_tasks: tasks/ai-tool.yml
      loop:
        - name: codex
          installer_url: https://chatgpt.com/codex/install.sh
          installer_shell: sh
          installer_environment:
            CODEX_NON_INTERACTIVE: '1'
            CODEX_INSTALL_DIR: "{{ user_bin_dir }}"
            CODEX_RELEASE: latest
        - name: claude
          installer_url: https://claude.ai/install.sh
          installer_shell: bash
      loop_control:
        loop_var: ai_tool
        label: "{{ ai_tool.name }}"

    - name: Install guest setup and diagnostic commands
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/{{ item }}"
        dest: "{{ user_bin_dir }}/{{ item }}"
        mode: '0755'
      loop:
        - setup-git
        - dev-doctor

    - name: Set zsh as the guest user's login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /bin/zsh

    - name: Remove the previous managed Bash PATH blocks
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
        marker: '# {mark} ANSIBLE MANAGED USER PATH'
        state: absent
      loop:
        - .profile
        - .bashrc

    - name: Install repository dotfiles
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../dotfiles/{{ item }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
        mode: '0644'
        backup: true
      loop:
        - .bash_profile
        - .zshenv
        - .zshrc
        - .tmux.conf

    - name: Check the installed uv version
      ansible.builtin.command:
        argv:
          - "{{ user_bin_dir }}/uv"
          - --version
      register: installed_uv
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report the planned uv installation
      ansible.builtin.debug:
        msg: "Would install uv {{ uv_version }} for the guest user."
      changed_when: true
      when:
        - ansible_check_mode
        - installed_uv.rc != 0 or installed_uv.stdout.split()[1] != uv_version

    - name: Install the pinned uv version
      when:
        - not ansible_check_mode
        - installed_uv.rc != 0 or installed_uv.stdout.split()[1] != uv_version
      block:
        - name: Create a temporary uv installer directory
          ansible.builtin.tempfile:
            state: directory
            prefix: lima-uv.
          register: uv_installer_temp

        - name: Download the versioned uv installer
          ansible.builtin.get_url:
            url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-installer.sh"
            dest: "{{ uv_installer_temp.path }}/install.sh"
            mode: '0600'

        - name: Run the uv installer
          ansible.builtin.command:
            argv:
              - sh
              - "{{ uv_installer_temp.path }}/install.sh"
          environment:
            UV_UNMANAGED_INSTALL: "{{ user_bin_dir }}"

        - name: Read the installed uv version
          ansible.builtin.command:
            argv:
              - "{{ user_bin_dir }}/uv"
              - --version
          register: verified_uv
          changed_when: false

        - name: Verify that uv matches the pinned version
          ansible.builtin.assert:
            that:
              - verified_uv.stdout.split() | length >= 2
              - verified_uv.stdout.split()[1] == uv_version
            fail_msg: "Expected uv {{ uv_version }}, got: {{ verified_uv.stdout }}"

      always:
        - name: Remove the temporary uv installer directory
          ansible.builtin.file:
            path: "{{ uv_installer_temp.path }}"
            state: absent
          when: uv_installer_temp.path is defined

    - name: Check for the requested uv-managed Python
      ansible.builtin.command:
        argv:
          - "{{ user_bin_dir }}/uv"
          - python
          - find
          - --managed-python
          - --no-python-downloads
          - "{{ python_version }}"
      register: installed_python
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode or installed_uv.rc == 0

    - name: Install the requested Python version with uv
      ansible.builtin.command:
        argv:
          - "{{ user_bin_dir }}/uv"
          - python
          - install
          - "{{ python_version }}"
      when:
        - not ansible_check_mode
        - installed_python.rc != 0
