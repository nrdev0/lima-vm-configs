# New prefix key to ctrl + s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable mouse support for pane selection, resizing, and scrolling.
set -g mouse on

# Number windows and panes starting at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Split panes in the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes by 5 cells; -r allows repeated presses.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload this configuration with prefix + r.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Minimal status bar: session label followed by numbered windows.
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=default,bg=default'
set -g status-right ''

# Highlight the session label while the prefix key is active.
set -g status-left '#[#{?client_prefix,reverse,bold}] #S #[default] '
set -g status-left-length 24

setw -g window-status-style 'fg=default,bg=default'
setw -g window-status-format ' #I '
setw -g window-status-current-style 'reverse,bold'
setw -g window-status-current-format ' #I '
setw -g window-status-separator ' '
