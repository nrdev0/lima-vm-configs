# Native Python development VM for macOS; provision after starting with:
# bash scripts/provision dev-python
minimumLimaVersion: 2.2.1
vmType: vz
os: Linux
arch: aarch64
# Ubuntu 26.04 LTS image and checksum from Lima's Ubuntu template.
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24
    variant: server
  # Dated images expire; fall back to the latest release without the old digest.
  - location: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    variant: server
cpus: 4
memory: 6GiB
disk: 100GiB
# Keep repositories and virtual environments on the guest filesystem.
mounts: []
# Apply OS upgrades deliberately instead of during every VM boot.
upgradePackages: false
# Enable a container runtime when the development workflow needs one.
containerd:
  system: false
  user: false
# Ubuntu 26.04 first-boot NIC rename workaround used by Lima's template.
param:
  internal_netplanOptional: "true"
user:
  # Ansible installs zsh and makes it the login shell after bootstrap.
  shell: /bin/bash
  passwordlessSudo: true
